<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>User search app</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header__logo">devfinder</div>
            <div class="header__theme-switcher">
                <div class="header__text">light</div>
                <img src="./icons/sun.svg" alt="" class="header__icon">
            </div>
        </header>
        
        <form class="search">
            <div class="wrapper">
                <img src="./icons/magnifier.svg" alt="search picture" class="search__icon">
                <label for="search-input"></label>
                <input type="search" id="search-input" class="search__input" placeholder="Search GitHub username...">
            </div>
            <button class="search__button" type="submit">Search</button>
        </form>

    </div>
</body>
</html>
