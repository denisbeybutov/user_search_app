<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>User search app</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header__logo">devfinder</div>
            <div class="header__theme-switcher">
                <div class="header__text">light</div>
                <img src="./icons/sun.svg" alt="" class="header__icon">
            </div>
        </header>
        
        <form class="search">
            <div class="wrapper">
                <img src="./icons/magnifier.svg" alt="search picture" class="search__icon">
                <label for="search-input"></label>
                <input type="search" id="search-input" class="search__input" placeholder="Search GitHub username...">
            </div>
            <button class="search__button" type="submit">Search</button>
        </form>

        <div class="card">
            <img src="./img/avatar.jpg" alt="avatar" class="card__avatar">
            <div class="card__main">
                <div class="card__header">
                    <div class="card__name">
                        <div class="card__main-name">The Octocat</div>
                        <div class="card__username">@octocat</div>
                    </div>
                    <div class="card__joined">Joined 25 Jan 2011</div>
                </div>
                
                <p class="card__bio">This profile has no bio</p>
                <div class="card__activity">
                    <div class="card__repos">
                        <p class="card__activity-name">Repos</p>
                        <p>8</p>
                    </div>
                    <div class="card__followers">
                        <p class="card__activity-name">Followers</p>
                        <p>3938</p>
                    </div>
                    <div class="card__following">
                        <p class="card__activity-name">Following</p>
                        <p>9</p>
                    </div>
                </div>
                <div class="card__contacts">
                    <ul class="card__list">
                        <li class="card__item">
                            <img src="./icons/pin.svg" alt="map pin" class="card__icon">
                            <a href="#" class="card__link">San Francisco</a>
                        </li>
                        <li class="card__item">
                            <img src="./icons/link.svg" alt="link" class="card__icon">
                            <a href="#" class="card__link">https://github.blog</a>
                        </li>
                    </ul>
                    <ul class="card__list">
                        <li class="card__item">
                            <img src="./icons/twitter.svg" alt="twitter" class="card__icon">
                            <a href="#" class="card__link">Not available</a>
                        </li>
                        <li class="card__item">
                            <img src="./icons/building.svg" alt="building" class="card__icon">
                            <a href="#" class="card__link">@github</a>
                        </li>
                    </ul>
                </div>
                
                
            </div>
        </div>

    </div>
</body>
</html>
